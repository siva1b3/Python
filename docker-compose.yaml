name: django-development

services:
  django-development-service:
    container_name: django-development-container
    image: django-development:5.2
    pull_policy: never

    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped

    working_dir: /workspace
    command: [ "tail", "-f", "/dev/null" ]

    ports:
      - "8000:8000"

    volumes:
      - type: bind
        source: ./workspace
        target: /workspace
        bind:
          create_host_path: true

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      VIRTUAL_ENV: /opt/venv

    networks:
      - django-development-network

networks:
  django-development-network:
    driver: bridge
